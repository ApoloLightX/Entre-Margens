name: Export Godot 4.5.1 runner

on:
  push:
    branches:
      - release/1.0-apk
  workflow_dispatch:

jobs:
  export-runner:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Package minimal Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          mkdir -p /tmp/entre-toolchain/android-sdk/build-tools /tmp/entre-toolchain/templates/4.5.1.stable
          BUILD_TOOLS="$(find /usr/lib/android-sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          cp -a "$BUILD_TOOLS" /tmp/entre-toolchain/android-sdk/build-tools/
          cp -a /usr/lib/android-sdk/platform-tools /tmp/entre-toolchain/android-sdk/
          cp -a /root/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk /tmp/entre-toolchain/templates/4.5.1.stable/
          tar -C /tmp/entre-toolchain -cf /tmp/android-toolchain-minimal.tar android-sdk templates
          ls -lh /tmp/android-toolchain-minimal.tar
          du -sh /tmp/entre-toolchain/android-sdk /tmp/entre-toolchain/templates

      - name: Upload minimal Android toolchain
        uses: actions/upload-artifact@v4
        with:
          name: entre-margens-android-toolchain-minimal-4.5.1
          path: /tmp/android-toolchain-minimal.tar
          compression-level: 0
          if-no-files-found: error
