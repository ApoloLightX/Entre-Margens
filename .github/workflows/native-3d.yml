name: Native 3D validation
on:
  workflow_dispatch:
  push:
    paths: ['native-3d/**', '.github/workflows/native-3d.yml']
  pull_request:
    paths: ['native-3d/**', '.github/workflows/native-3d.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: |
          curl --fail -L https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
      - name: Import and verify native project
        run: |
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path native-3d --editor --quit
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path native-3d --script scripts/test_rules.gd
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path native-3d --script scripts/test_scene.gd
