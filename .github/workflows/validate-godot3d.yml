name: Validate Godot 3D

on:
  push:
    branches:
      - work/3.0-iqaluit-icewarrior
  pull_request:
    paths:
      - "godot3d/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
      - name: Godot version
        run: godot --version
      - name: Import and parse project
        run: godot --headless --path godot3d --editor --quit
      - name: Smoke-run main scene
        run: godot --headless --path godot3d --quit-after 8
