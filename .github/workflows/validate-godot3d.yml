name: Validate and Build Godot 3D

on:
  push:
    branches:
      - work/3.0-iqaluit-icewarrior
  pull_request:
    paths:
      - "godot3d/**"
  workflow_dispatch:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Godot 4.5.1 export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"             -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create temporary debug keystore
        shell: bash
        run: |
          mkdir -p development
          keytool -genkeypair -v             -keystore development/android-debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Android Debug,O=Entre Margens,C=BR"             -keyalg RSA -keysize 2048 -validity 10000

      - name: Godot version
        run: godot --version

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot3d --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -q "ERROR:" /tmp/godot-import.log; then exit 1; fi

      - name: Smoke-run main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot3d --quit-after 8 2>&1 | tee /tmp/godot-smoke.log
          if grep -q "ERROR:" /tmp/godot-smoke.log; then exit 1; fi

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p godot3d/build
          set -o pipefail
          godot --headless --path godot3d --export-debug "Android APK" godot3d/build/Entre_Margens_Iqaluit_3D_Debug.apk 2>&1 | tee /tmp/godot-export.log
          if grep -q "ERROR:" /tmp/godot-export.log; then exit 1; fi
          test -s godot3d/build/Entre_Margens_Iqaluit_3D_Debug.apk

      - name: APK checksum
        shell: bash
        run: |
          sha256sum godot3d/build/Entre_Margens_Iqaluit_3D_Debug.apk | tee godot3d/build/SHA256.txt
          ls -lh godot3d/build/Entre_Margens_Iqaluit_3D_Debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Entre-Margens-Iqaluit-3D-Android
          path: |
            godot3d/build/Entre_Margens_Iqaluit_3D_Debug.apk
            godot3d/build/SHA256.txt
          if-no-files-found: error
          retention-days: 30
